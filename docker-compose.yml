name: academia-juridico-contabil

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

x-app-environment: &app-environment
  NODE_ENV: production
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Defina NEXT_PUBLIC_SITE_URL no .env}
  NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
  CLOUDFLARE_CACHE_PURGE_ENABLED: ${CLOUDFLARE_CACHE_PURGE_ENABLED:-false}
  CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  PGHOST: db
  PGPORT: "5432"
  PGDATABASE: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
  PGUSER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
  PGPOOL_MAX: ${PGPOOL_MAX:-10}
  MAX_BULK_ARTICLE_EXPORT: ${MAX_BULK_ARTICLE_EXPORT:-200}
  MAX_REFERENCE_EXPORT: ${MAX_REFERENCE_EXPORT:-2000}
  MAX_FICHAMENTO_EXPORT: ${MAX_FICHAMENTO_EXPORT:-5000}
  DATABASE_SSL: "false"
  AUTH_SECRET: ${AUTH_SECRET:?Defina AUTH_SECRET no .env}
  ANALYTICS_HASH_SECRET: ${ANALYTICS_HASH_SECRET:?Defina ANALYTICS_HASH_SECRET no .env}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL no .env}
  ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Defina ADMIN_PASSWORD_HASH no .env}
  DEFAULT_AUTHOR_NAME: ${DEFAULT_AUTHOR_NAME:-Autor}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  CONTACT_FROM: ${CONTACT_FROM:-}
  CONTACT_TO: ${CONTACT_TO:-}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8"
    # Database tuning mínimo: balanceado entre performance e consumo de memória
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=4MB
      - -c
      - default_statistics_target=50
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=50
      - -c
      - log_min_duration_statement=1000
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrate:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Defina NEXT_PUBLIC_SITE_URL no .env}
    image: academia-juridico-contabil:${APP_IMAGE_TAG:-local}
    restart: "no"
    command: ["node", "scripts/migrate.mjs"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Defina NEXT_PUBLIC_SITE_URL no .env}
    image: academia-juridico-contabil:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/storage/uploads
      - next_cache:/app/.next/cache
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

volumes:
  postgres_data:
  uploads_data:
  next_cache:
